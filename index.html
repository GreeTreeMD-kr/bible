<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf6ee"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>푸른나무교회 성경 통독하기</title>
<style>
:root{--bg:#fdf6ee;--ink:#2f3e5c;--sub:#5c6a86;--line:#eadfd2;--sk:#cbe6fa;--c1:#FFF0B0;--c2:#D9F3C9;--c3:#CBE6FA;--c4:#F9D3E3;--fs:17px;--d1:#F2C94C;--d2:#79C768;--d3:#4FA3E8;--d4:#EC7BA6;--du:#9B7FD6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
.b{height:40px;padding:0 14px;border-radius:12px;font-size:.85rem;font-weight:600;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.b.on{background:#E4DBF6;border-color:#cdbff0}.b.fx{background:var(--sk);border-color:var(--sk)}.b.fx.on{background:#9cc8ee;border-color:#9cc8ee}.b.w{width:100%;margin-top:10px}
.inf{font-size:.9rem;color:var(--sub);font-weight:600}
#cover{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#d6eafb,#fde0ea 55%,#fff0c4);overflow:hidden}
#cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.box{position:relative;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);border-radius:30px;padding:30px 24px 20px;width:min(88%,380px);box-shadow:0 12px 40px #6f7fa526}
.box h1{margin:8px 0 14px;font-size:1.6rem;line-height:1.35;letter-spacing:-.02em}
.gr{margin:0 0 16px;font-size:1.05rem;line-height:1.6}
#nm{width:100%;border:2px solid var(--sk);background:#fff;border-radius:16px;padding:14px;font-size:1.1rem;text-align:center;outline:none;margin-bottom:14px}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-size:1.15rem;font-weight:700;background:#BFE5C4}
.lks{display:flex;justify-content:center;gap:18px;margin-top:12px}.lks a,.ft a{font-size:.8rem;color:var(--sub);text-decoration:underline;padding:8px 4px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#app{display:none;padding:10px 14px 40px;max-width:680px;margin:0 auto}
#upd{display:none;background:var(--c1);padding:12px;border-radius:14px;text-align:center;margin-bottom:10px;font-weight:700}
.bn{background:#fff;border:2px solid var(--c1);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:.85rem;line-height:1.55}
.bn .b{margin:8px 8px 0 0}
.stk{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:4px 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h2{margin:0;font-size:1rem;display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer}h2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid transparent;opacity:.75}.tab.on{opacity:1;border-color:var(--ink);font-weight:700}.tab.pl{background:#fff;border:2px dashed var(--line);opacity:1}
.card{background:#fff;border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 4px 18px #7f8fb314}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:40px}.trow:last-child{margin-bottom:0}
.prog{font-weight:700;color:var(--sub);font-size:.9rem;white-space:nowrap}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.st{display:grid;grid-template-columns:2.6em 1fr 3.8em;gap:8px;align-items:center;margin:10px 0;font-size:.9rem}
.st em{font-style:normal;text-align:right;font-weight:700}
.pb{position:relative;height:18px;background:#efe6da;border-radius:9px;overflow:hidden}.pb i{position:absolute;left:0;top:0;height:100%;border-radius:0 9px 9px 0;transition:width .4s}
.lg{display:flex;gap:6px;flex-wrap:wrap;font-size:.74rem;margin-top:10px}.lg span{padding:3px 9px;border-radius:9px;color:#1f2a44;font-weight:700}
.mini{font-size:.78rem;color:var(--sub);margin-top:10px;line-height:1.5}
select{border:2px solid var(--sk);border-radius:12px;background:#fff;height:40px;padding:0 10px;font-weight:700;font-size:.85rem;max-width:48%}
.g{display:grid;gap:5px;container-type:inline-size;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.c{position:relative;aspect-ratio:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:600;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.7rem;font-size:calc(100cqw / var(--n) * .42)}
.v1{background:var(--c1)!important}.v2{background:var(--c2)!important}.v3{background:var(--c3)!important}.v4{background:var(--c4)!important}.vu{background:#D9CCF2!important}
.ck::after{content:"✓";position:absolute;right:2px;top:0;font-size:.7em;color:#3e7d54}
.pop{animation:pp .3s}@keyframes pp{50%{transform:scale(1.15)}}
.sgr{display:flex;gap:10px;margin-bottom:12px}.sgr .b{flex:1}
.map{display:grid;gap:2px;grid-template-columns:26px repeat(10,minmax(0,1fr));container-type:inline-size}
.map h4{grid-column:1/-1;margin:12px 0 4px;font-size:.9rem}
.map i{aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;border-radius:4px;background:#fff;border:1px solid var(--line);font-style:normal;overflow:hidden;font-size:9px;font-size:calc(100cqw / 11 * .38)}
.map u,.map s{text-decoration:none}
.lb{display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:6px;font-size:11px;font-weight:700;min-width:0}
.ft{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:.78rem;padding:0 4px}
.dmv{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 40px}.dmi{max-width:480px;margin:0 auto}
.mo{position:fixed;inset:0;background:#2f3e5c55;z-index:9;display:flex;align-items:center;justify-content:center}
.md{background:#fff;border-radius:22px;padding:20px;width:min(86%,340px)}.md p{margin:0 0 12px;line-height:1.5}
.md input,.md textarea{width:100%;border:2px solid var(--sk);border-radius:12px;padding:11px;margin-bottom:10px}
.md button{display:block;width:100%;border:0;border-radius:12px;height:44px;margin-top:8px;background:var(--sk);font-weight:600}.md button:last-child{background:var(--bg)}
.sw{display:flex;gap:8px;margin:2px 0 8px}.sw b{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}.sw b.on{box-shadow:0 0 0 3px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;z-index:10;font-size:.9rem;max-width:90%;text-align:center}
.ub{border:0;background:#fff;color:var(--ink);border-radius:9px;padding:6px 10px;margin-left:8px;font-weight:700}
.md p,.toast,.bn,.mini,.gr,.inf{word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.c{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.c.sel{box-shadow:inset 0 0 0 3px var(--ink)}.lb[data-bk]{cursor:pointer;text-decoration:underline}
@supports not (font-size:1cqw){.c{font-size:.8rem}.g[style*="--n:10"] .c{font-size:.6rem}.map i{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="cover"><img src="cover.jpg?v=3" alt="" onerror="this.remove()"><div class="box"><div id="tr"></div><h1>푸른나무교회<br>성경 통독하기</h1><div id="cvb"></div></div></div>
<div id="app"><div id="upd">새 버전이 있어요. 눌러서 업데이트</div><div id="ban"></div><div class="stk"><div class="hd" id="hd"></div><div class="tabs" id="tabs"></div></div><div id="main"></div></div>
<input type="file" id="imp" hidden>
<script>
const VER='3.1.1',KEY='bible_v1';
const B=[];'창세기50,출애굽기40,레위기27,민수기36,신명기34,여호수아24,사사기21,룻기4,사무엘상31,사무엘하24,열왕기상22,열왕기하25,역대상29,역대하36,에스라10,느헤미야13,에스더10,욥기42,시편150,잠언31,전도서12,아가8,이사야66,예레미야52,예레미야애가5,에스겔48,다니엘12,호세아14,요엘3,아모스9,오바댜1,요나4,미가7,나훔3,하박국3,스바냐3,학개2,스가랴14,말라기4,마태복음28,마가복음16,누가복음24,요한복음21,사도행전28,로마서16,고린도전서16,고린도후서13,갈라디아서6,에베소서6,빌립보서4,골로새서4,데살로니가전서5,데살로니가후서3,디모데전서6,디모데후서4,디도서3,빌레몬서1,히브리서13,야고보서5,베드로전서5,베드로후서3,요한일서5,요한이서1,요한삼서1,유다서1,요한계시록22'.replace(/([^\d,]+)(\d+)/g,(m,n,c)=>B.push({n,c:+c}));
const AB='창,출,레,민,신,수,삿,룻,삼상,삼하,왕상,왕하,대상,대하,스,느,에,욥,시,잠,전,아,사,렘,애,겔,단,호,욜,암,옵,욘,미,나,합,습,학,슥,말,마,막,눅,요,행,롬,고전,고후,갈,엡,빌,골,살전,살후,딤전,딤후,딛,몬,히,약,벧전,벧후,요일,요이,요삼,유,계'.split(',');
const OT=39,OTC=929,NTC=260,TOT=1189,PAL=['#E4DBF6','#FFD8CC','#C9EEE2','#FFE0B5','#F0D5F2','#D5DEEE'];
const DK=['','var(--d1)','var(--d2)','var(--d3)','var(--d4)'],CL=['','var(--c1)','var(--c2)','var(--c3)','var(--c4)'],NM=['한 번','두 번','세 번','네 번'],ORD=['','첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return (d.getMonth()+1)+'월 '+d.getDate()+'일'};
const mk=(n,c)=>({id:uid(),name:n,color:c,round:1,start:today(),book:0,base:{},read:{}});
const TR=s=>'<svg viewBox="0 0 64 64" width="'+s+'" height="'+s+'" style="vertical-align:middle;flex:none"><circle cx="32" cy="24" r="18" fill="#BFE5C4"/><circle cx="20" cy="33" r="12" fill="#CDEBD0"/><circle cx="44" cy="33" r="12" fill="#B3DEB9"/><rect x="29" y="40" width="6" height="17" rx="3" fill="#E8C9A8"/></svg>';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{name:'',tables:[],ui:{}};
S.ui=Object.assign({cols:5,fs:0,tab:0,view:'c',sec:'a',tsec:'a',vw:'g'},S.ui);if(S.ui.cols!=5)S.ui.cols=10;
S.tables.forEach((t,i)=>{t.base=t.base||{};t.round=t.round||1;t.color=t.color==null?i%6:t.color;t.start=t.start||'';t.book=t.book|0});
(S.arch||[]).forEach(a=>S.tables.push({id:a.id,name:a.name,color:0,round:1,start:'',book:0,base:{},read:a.read}));delete S.arch;
S.since=S.since||Date.now();if(!S.tables.length)S.tables.push(mk('내 통독표',0));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const applyFs=()=>document.documentElement.style.setProperty('--fs',[17,21][S.ui.fs]+'px');
const cnt=(t,b,i)=>((t.base[b]||[])[i]|0)+((t.read[b]||[])[i]|0);
const pc=(x,t)=>(x/t*100).toFixed(1);
const hasMark=t=>Object.values(t.read).some(a=>a.some(x=>x));
function st(f){const r={o:[0,0,0,0],n:[0,0,0,0]};B.forEach((k,b)=>{const a=b<OT?r.o:r.n;for(let i=0;i<k.c;i++){const v=f(b,i);for(let j=0;j<4;j++)if(v>j)a[j]++}});return r}
const rd=(f,b)=>{let d=0;for(let i=0;i<B[b].c;i++)if(f(b,i)>0)d++;return d};
const mn=(f,b)=>{let m=1e9;for(let i=0;i<B[b].c;i++)m=Math.min(m,f(b,i));return m};
const cc=v=>v?' v'+Math.min(v,4):'';
const snap=()=>JSON.stringify({t:S.tables,tab:S.ui.tab,n:S.name});
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2400)}
function toastU(m,sn){const d=document.createElement('div');d.className='toast';d.innerHTML=esc(m)+'<button class="ub">되돌리기</button>';d.querySelector('button').onclick=()=>{const o=JSON.parse(sn);S.tables=o.t;S.ui.tab=o.tab;if(o.n!=null)S.name=o.n;save();d.remove();render(0);toast('되돌렸어요')};document.body.append(d);setTimeout(()=>d.remove(),10000)}
function ask(m,bs){return new Promise(r=>{const d=document.createElement('div');d.className='mo';d.innerHTML='<div class="md"><p>'+m+'</p>'+bs.map((b,i)=>'<button data-q="'+i+'">'+b+'</button>').join('')+'</div>';d.onclick=e=>{const i=e.target.dataset.q;if(i!=null){d.remove();r(+i)}};document.body.append(d)})}
function askIn(m,v,col){return new Promise(r=>{let ci=col;const d=document.createElement('div');d.className='mo';
 d.innerHTML='<div class="md"><p>'+m+'</p><input id="ai" maxlength="14" value="'+esc(v)+'">'+(col!=null?'<div class="sw">'+PAL.map((c,i)=>'<b data-s="'+i+'" style="background:'+c+'" class="'+(i==col?'on':'')+'"></b>').join('')+'</div>':'')+'<button data-q="0">확인</button><button data-q="1">취소</button></div>';
 d.onclick=e=>{const s=e.target.dataset.s;if(s!=null){ci=+s;d.querySelectorAll('.sw b').forEach((x,i)=>x.classList.toggle('on',i==ci));return}
  const q=e.target.dataset.q;if(q!=null){const val=$('#ai').value.trim();d.remove();r(q==0&&val?{v:val,c:ci}:null)}};
 document.body.append(d);setTimeout(()=>$('#ai').focus(),50)})}
function bars(r,m){const rows=[['구약',r.o,OTC],['신약',r.n,NTC],['전체',r.o.map((x,j)=>x+r.n[j]),TOT]];
 const h=rows.map(([n,a,t])=>{const ly=m=='u'?'<i style="width:'+pc(a[0],t)+'%;background:var(--du);z-index:1"></i>':[0,1,2,3].filter(j=>j==0||a[j]>0).map(j=>'<i style="width:'+pc(a[j],t)+'%;background:'+DK[j+1]+';z-index:'+(j+1)+'"></i>').join('');
  return '<div class="st"><span>'+n+'</span><div class="pb">'+ly+'</div><em>'+pc(a[0],t)+'%</em></div>'}).join('');
 return h+(m=='u'?'':'<div class="lg">'+NM.map((n,j)=>'<span style="background:'+DK[j+1]+'">'+n+(j==3?' 이상':'')+'</span>').join('')+'</div>')}
function bsel(f,n){let h='<select id="bs">';B.forEach((k,b)=>{if(b==0)h+='<optgroup label="구약">';if(b==OT)h+='</optgroup><optgroup label="신약">';h+='<option value="'+b+'"'+(b==n?' selected':'')+'>'+k.n+(rd(f,b)==k.c?' ✓':'')+'</option>'});return h+'</optgroup></select>'}
let pop=-1;
const foot=()=>'<div class="ft"><a data-act="dm">데이터 관리</a><span>버전 '+VER+'</span></div>';
function tbHtml(t){const f=(b,i)=>cnt(t,b,i),n=t.book,a=t.read[n]||[],cl=PAL[t.color],N=S.ui.cols,seg='<div class="sgr">'+[['5','5열'],['10','10열'],['m','전체']].map(x=>'<button class="b'+((S.ui.vw=='m'?'m':N)==x[0]?' on':'')+'" data-act="vw" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
 const cells=Array.from({length:B[n].c},(_,i)=>'<button class="c'+cc(f(n,i))+(a[i]&&t.round>1?' ck':'')+(pop==i?' pop':'')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');
 return '<div class="card" style="background:'+cl+'55;border:2px solid '+cl+'"><div class="trow"><span class="inf">'+ORD[Math.min(t.round,10)]+' 번째 읽는 중'+(t.start?' · '+t.start+' 시작':'')+'</span></div>'+bars(st(f),'c')+'</div>'
 +'<div class="card" style="border:2px solid '+cl+'">'+seg+(S.ui.vw=='m'?secBtns(S.ui.tsec,'tsec')+mapHtml(f,S.ui.tsec,0,1)+'<div class="mini">책 이름을 누르면 그 책의 칸 표로 이동해요.</div>':'<div class="trow">'+bsel(f,n)+'<span class="prog">'+rd(f,n)+' / '+B[n].c+'장</span></div><div class="g" style="--n:'+N+'">'+cells+'</div><div class="mini">칸을 길게 누른 채 위아래로 밀면 여러 줄이 한꺼번에 표시돼요.</div>')+'</div>'
 +'<div class="acts"><button class="b" data-act="new">새로 읽기</button>'+(t.round>1?'<button class="b" data-act="keep">이번 회차만 남기기</button>':'')+'<button class="b" data-act="del">이 통독표 삭제</button></div>'+foot()}
const secBtns=(cur,act)=>'<div class="sgr">'+[['a','전체'],['n','신약만'],['o','구약만']].map(x=>'<button class="b'+(cur==x[0]?' on':'')+'" data-act="'+act+'" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
function mapHtml(f,sec,un,link){let h='<div class="map">';
 B.forEach((k,b)=>{if(sec=='n'&&b<OT||sec=='o'&&b>=OT)return;if(b==0)h+='<h4>구약 39권 929장</h4>';if(b==OT)h+='<h4>신약 27권 260장</h4>';
  const m=mn(f,b),lc=un?(m>0?' vu':''):cc(m);
  for(let s=0;s<k.c;s+=10){h+=s?'<s></s>':'<div class="lb'+lc+'"'+(link?' data-bk="'+b+'"':'')+'>'+AB[b]+'</div>';
   for(let i=s;i<s+10;i++){if(i<k.c){const v=f(b,i);h+='<i class="'+(un?(v?'vu':''):cc(v).trim())+'">'+(i+1)+'</i>'}else h+='<u></u>'}}});
 return h+'</div>'}
function ovHtml(){const u=S.ui,un=u.view=='u',f=(b,i)=>S.tables.reduce((s,t)=>s+cnt(t,b,i),0),r=st(f);let full=1e9;B.forEach((k,b)=>{full=Math.min(full,mn(f,b))});
 let h='<div class="card"><div class="trow"><span class="inf">완독 '+full+'회</span><span style="flex:1"></span><button class="b'+(un?' on':'')+'" data-act="view">중복제거 보기</button></div>'+bars(r,un?'u':'c')+'<div class="mini">합산한 통독표: '+S.tables.map(x=>esc(x.name)).join(', ')+'</div></div>';
 h+='<div class="card">'+secBtns(u.sec,'sec')+mapHtml(f,u.sec,un,0)+'</div>';return h+foot()}
function banners(){const ua=navigator.userAgent,ios=/iPhone|iPad/.test(ua);let h='';

 else if(!S.hint&&!(matchMedia('(display-mode: standalone)').matches||navigator.standalone))h+='<div class="bn" data-act="hint">'+(ios?'아이폰: 사파리 아래 공유 버튼 → 「홈 화면에 추가」. 꼭 홈 화면의 아이콘으로 시작하세요.':'갤럭시: 메뉴(⋮) → 「홈 화면에 추가」 또는 「앱 설치」를 눌러 주세요.')+'<br><b>눌러서 닫기</b></div>';
 if(Date.now()-(S.lastT||S.since)>30*864e5)h+='<div class="bn" data-act="dm">백업한 지 한 달이 지났어요. 눌러서 「데이터 관리」에서 백업해 두세요.</div>';
 if(!S.tip&&S.ui.tab>=0)h+='<div class="bn" data-act="tip">읽은 장의 번호를 눌러 표시하세요. 다시 누르면 지워져요. 번호를 길게 누른 채 위아래로 밀면 여러 줄이 한꺼번에 표시돼요. 또 읽고 싶으면 「새로 읽기」를 눌러요.<br><b>눌러서 닫기</b></div>';
 return h}
function render(y){const u=S.ui;if(u.tab>=S.tables.length)u.tab=0;const ov=u.tab<0,t=ov?null:S.tables[u.tab];applyFs();
 $('#hd').innerHTML='<h2 id="tt">'+TR(22)+'<span>'+esc(S.name)+'의 성경읽기 ✎</span></h2><button class="b fx'+(ov?' on':'')+'" data-act="all">나의 통독 현황</button>';

 d.innerHTML='<div class="dmi"><div class="trow"><b>데이터 관리</b><span style="flex:1"></span><button class="b" data-d="x">닫기</button></div><div class="inf">글자 크기</div><div class="sgr" style="margin-top:10px">'+['보통','크게'].map((x,i)=>'<button class="b'+(S.ui.fs==i?' on':'')+'" data-d="f'+i+'">'+x+'</button>').join('')+'</div>'
 +'<div class="inf" style="margin-top:18px">백업과 이동</div><button class="b w" data-d="exp">내보내기 (파일로 공유)</button><button class="b w" data-d="cpy">복사하기 (글자로)</button><button class="b w" data-d="imp">불러오기</button><div class="mini">마지막 백업: '+(S.last||'아직 없음')+'</div><div class="mini">폰을 바꿀 때: 옛 폰에서 「복사하기」 → 카톡 나에게 보내기. 새 폰에서 그 글자를 복사한 뒤 「불러오기」 → 글자 붙여넣기.</div>'
 +'<button class="b w" style="margin-top:18px" data-d="chk">새 버전 확인</button><div class="mini" style="text-align:center">버전 '+VER+'</div></div>';
 d.onclick=async e=>{const k=e.target.closest('[data-d]');if(!k)return;const a=k.dataset.d;
  if(a=='x'){d.remove();refresh()}
  else if(a[0]=='f'){S.ui.fs=+a[1];save();applyFs();d.querySelectorAll('[data-d^=f]').forEach(x=>x.classList.toggle('on',x.dataset.d==a))}
  else if(a=='exp'){await exp();d.remove();showDM()}
  else if(a=='cpy'){await cpy();d.remove();showDM()}
  else if(a=='imp')impAsk();
  else if(a=='chk'){toast('확인 중이에요…');try{await fetch('./')}catch(x){toast('인터넷에 연결되어 있지 않아요');return}setTimeout(()=>location.reload(),1800)}};
 document.body.append(d)}
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-act],[data-i],[data-t],[data-bk]');if(!el||el.closest('.mo')||$('#app').style.display!='block')return;
 const D=el.dataset,u=S.ui,y=scrollY,ov=u.tab<0,t=S.tables[u.tab];
 if(D.i!=null){const a=t.read[t.book]||(t.read[t.book]=Array(B[t.book].c).fill(0)),i=+D.i;a[i]=a[i]?0:1;pop=a[i]?i:-1;save();render(y);if(a[i]&&a.every(x=>x))toast(B[t.book].n+' 읽기를 마쳤어요. 축하해요!');return}
 if(D.bk!=null){t.book=+D.bk;u.vw='g';save();render(0);focusFirst();return}
 if(D.t!=null){if(+D.t==u.tab){const r=await askIn('통독표 이름과 색을 골라 주세요',t.name,t.color);if(r){t.name=r.v;t.color=r.c;save();render(y)}}else{u.tab=+D.t;save();render(0);focusFirst()}return}
 switch(D.act){
  case 'vw':u.vw=D.v=='m'?'m':'g';if(D.v!='m')u.cols=+D.v;save();render(y);break;
  case 'tsec':u.tsec=D.v;save();render(y);break;
  case 'all':u.tab=-1;save();render(0);break;
  case 'view':u.view=u.view=='u'?'c':'u';save();render(y);break;
  case 'sec':u.sec=D.v;save();render(y);break;
  case 'hint':S.hint=1;save();render(y);break;
  case 'tip':S.tip=1;save();render(y);break;
  case 'dm':showDM();break;
  case 'kk':location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);break;
  case 'cu':try{await navigator.clipboard.writeText(location.href);toast('주소를 복사했어요. 사파리나 크롬 주소창에 붙여넣어 주세요')}catch(x){toast('복사하지 못했어요')}break;
  case 'add':{const r=await askIn('새 통독표 이름을 적어 주세요','새 통독표',S.tables.length%6);if(r){S.tables.push(mk(r.v,r.c));u.tab=S.tables.length-1;save();render(0)}break}
  case 'new':{if(!hasMark(t)){toast('새로 읽을 체크가 아직 없어요');break}
   if(await ask('지금까지 화면에 체크한 기록을 삭제할까요?',['확인','취소'])!=0)break;
   const q=await ask('이 통독표에서 읽은 기록은 남길까요?',['남기기','남기지 않기','취소']);if(q==2)break;
   if(q==1&&await ask('읽은 기록을 모두 완전히 삭제하겠습니다.',['확인','취소'])!=0)break;
   const sn=snap();
   if(q==0){Object.keys(t.read).forEach(b=>{const a=t.base[b]||(t.base[b]=Array(B[b].c).fill(0));t.read[b].forEach((v,i)=>{a[i]=Math.min(9,a[i]+v)})});t.read={};t.round++}
   else{t.read={};t.base={};t.round=1}
   t.start=today();save();render(0);toastU(q==0?'기록을 남기고 새로 시작했어요':'처음부터 새로 시작했어요',sn);break}
  case 'keep':if(await ask('이전에 읽은 기록은 지우고, 이번에 체크한 칸만 남길까요?<br>이번에 읽은 칸은 노랑으로, 나머지는 흰색으로 바뀌고 첫 번째 읽기로 돌아가요.',['확인','취소'])==0){const sn=snap();t.base={};t.round=1;save();render(y);toastU('이번 회차만 남겼어요',sn)}break;
  case 'del':{if(await ask('지금 읽고 계신 「'+esc(t.name)+'」 통독표가 사라져요.<br>그래도 삭제하시겠어요?',['삭제하기','취소'])!=0)break;
   if(await ask('읽은 기록을 모두 완전히 삭제하겠습니다.<br>나의 통독 현황에서도 줄어들어요.',['확인','취소'])!=0)break;
   const sn=snap();S.tables.splice(u.tab,1);if(!S.tables.length)S.tables.push(mk('내 통독표',0));u.tab=0;save();render(0);toastU('삭제했어요',sn);break}}});
const ps=a=>a.join(''),us=s=>typeof s=='string'?s.split('').map(Number):s,mp=(o,f)=>Object.fromEntries(Object.entries(o||{}).map(([b,a])=>[b,f(a)]));
const pt=t=>({id:t.id,name:t.name,color:t.color,round:t.round,start:t.start,book:t.book,read:mp(t.read,ps),base:mp(t.base,ps)});
const ut=t=>({id:t.id||uid(),name:t.name||'통독표',color:t.color|0,round:t.round||1,start:t.start||'',book:t.book|0,read:mp(t.read,us),base:mp(t.base,us)});
const pack=()=>JSON.stringify({app:'bible',v:3,data:{name:S.name,tables:S.tables.map(pt)}});
const stamp=()=>{S.last=new Date().toLocaleDateString('ko-KR');S.lastT=Date.now();save()};
async function exp(){const d=new Date(),p=n=>String(n).padStart(2,'0'),fn='성경통독백업_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
 const file=new File([pack()],fn,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});stamp();return}catch(e){if(e.name=='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=fn;a.click();stamp()}
async function cpy(){const t='BIBLE1:'+btoa(unescape(encodeURIComponent(pack())));
 try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}
 stamp();toast('복사했어요. 카톡 나에게 보내기에 붙여넣으세요')}

function askText(){return new Promise(r=>{const d=document.createElement('div');d.className='mo';d.innerHTML='<div class="md"><p>복사해 둔 백업 글자를 붙여넣어 주세요.</p><textarea id="pt" rows="5" style="font-size:.8rem"></textarea><button data-q="0">불러오기</button><button data-q="1">취소</button></div>';d.onclick=e=>{const i=e.target.dataset.q;if(i!=null){const v=$('#pt').value;d.remove();r(i==0?v:null)}};document.body.append(d)})}
async function impAsk(){const q=await ask('어떻게 불러올까요?',['글자 붙여넣기 (쉬워요)','파일 선택','취소']);if(q==1)$('#imp').click();else if(q==0){const v=await askText();if(v){try{await apply(parse(v).data)}catch(x){toast('붙여넣은 글자가 올바르지 않아요')}}}}
async function apply(d){if(!d||!Array.isArray(d.tables))throw 0;const T=d.tables.map(ut);
 const c=await ask('백업에 통독표가 '+T.length+'개 있어요.',['합치기 (지금 기록 유지)','덮어쓰기 (지금 기록 삭제)','취소']);if(c==2)return;
 if(c==1&&await ask('지금 기록이 모두 사라지고 백업 내용으로 바뀌어요.<br>정말 덮어쓸까요?',['덮어쓰기','취소'])!=0)return;
 const sn=snap();
 if(c==1){S.tables=T;S.name=d.name||S.name}
 else{T.forEach(t=>{const m=S.tables.find(x=>x.id==t.id);if(!m)S.tables.push(t);else{Object.keys(t.read).forEach(b=>{const a=m.read[b]||(m.read[b]=Array(B[b].c).fill(0));t.read[b].forEach((v,i)=>{if(v)a[i]=1})});Object.keys(t.base).forEach(b=>{const a=m.base[b]||(m.base[b]=Array(B[b].c).fill(0));t.base[b].forEach((v,i)=>{a[i]=Math.max(a[i],v)})});m.round=Math.max(m.round,t.round)}});if(!S.name)S.name=d.name||''}
 if(!S.tables.length)S.tables.push(mk('내 통독표',0));S.ui.tab=0;save();document.querySelectorAll('.dmv').forEach(x=>x.remove());refresh();toastU(c==1?'덮어썼어요':'불러왔어요',sn)}
$('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await apply(parse(await f.text()).data)}catch(x){toast('올바른 백업 파일이 아니에요')}e.target.value=''};
function focusFirst(){const t=S.tables[S.ui.tab];if(!t||S.ui.vw=='m')return;const a=t.read[t.book]||[],n=B[t.book].c;let i=0;while(i<n&&a[i])i++;if(i>=n||i<S.ui.cols)return;const c=document.querySelector('.g .c[data-i="'+i+'"]');if(c)c.scrollIntoView({block:'center'})}
let LP=null;
function mark(){if(!LP)return;const lo=Math.min(LP.r0,LP.r1),hi=Math.max(LP.r0,LP.r1);LP.g.querySelectorAll('.c').forEach(c=>{const r=Math.floor(+c.dataset.i/LP.N);c.classList.toggle('sel',r>=lo&&r<=hi)})}
function endLP(){if(LP){clearTimeout(LP.tm);LP.g.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));LP=null}}
document.addEventListener('touchstart',e=>{const c=e.target.closest('.g .c');if(!c||e.touches.length>1||S.ui.tab<0)return;const p=e.touches[0],i=+c.dataset.i,N=S.ui.cols;
 LP={g:c.parentNode,N,x:p.clientX,y:p.clientY,i0:i,r0:Math.floor(i/N),r1:Math.floor(i/N),on:0,mv:0};
 LP.tm=setTimeout(()=>{if(!LP)return;LP.on=1;if(navigator.vibrate)navigator.vibrate(30);mark()},400)},{passive:true});
document.addEventListener('touchmove',e=>{if(!LP)return;const p=e.touches[0];
 if(!LP.on){if(Math.hypot(p.clientX-LP.x,p.clientY-LP.y)>10){clearTimeout(LP.tm);LP=null}return}
 e.preventDefault();const el=document.elementFromPoint(p.clientX,p.clientY),c=el&&el.closest('.g .c');
 if(c){if(+c.dataset.i!=LP.i0)LP.mv=1;LP.r1=Math.floor(+c.dataset.i/LP.N);mark()}},{passive:false});
document.addEventListener('touchend',e=>{if(!LP)return;clearTimeout(LP.tm);const L=LP;if(!L.on){LP=null;return}
 e.preventDefault();if(!L.mv){endLP();return}
 const t=S.tables[S.ui.tab],bk=t.book,n=B[bk].c,N=L.N,lo=Math.min(L.r0,L.r1),hi=Math.max(L.r0,L.r1),a=t.read[bk]||(t.read[bk]=Array(n).fill(0));
 let un=false;for(let i=L.r0*N;i<Math.min(n,(L.r0+1)*N);i++)if(!a[i])un=true;
 const sn=snap(),y=scrollY;for(let i=lo*N;i<Math.min(n,(hi+1)*N);i++)a[i]=un?1:0;
 LP=null;save();render(y);toastU(un?'여러 줄을 읽음으로 표시했어요':'여러 줄의 표시를 지웠어요',sn)},{passive:false});
document.addEventListener('touchcancel',endLP);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.g'))e.preventDefault()});
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=1;location.reload()}});navigator.serviceWorker.addEventListener('message',e=>{if(e.data=='update')$('#upd').style.display='block'})}
showCover();
